
name: Immortalwrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Tashkent


jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH imwrt
        ln -sf /workdir/imwrt $GITHUB_WORKSPACE/imwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF imwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd imwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd imwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd imwrt && ./scripts/feeds install -a

    - name: Load custom configuration (initram)
      run: |
        mkdir -p imwrt/files
        cp -R "$GITHUB_WORKSPACE/files/." imwrt/files/
        cp "$GITHUB_WORKSPACE/files/.config_initram" imwrt/.config
        chmod +x $DIY_P2_SH
        cd imwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd imwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Add Xiaomi Mi Router 4A 32MB device
      run: |
        cd imwrt

        MT7621_MK="target/linux/ramips/image/mt7621.mk"

        if ! grep -q '^define Device/xiaomi_mi-router-4a-gigabit-32mb$' "$MT7621_MK"; then
          cat >> "$MT7621_MK" <<'EOF'
    define Device/xiaomi_mi-router-4a-gigabit-32mb
      $(Device/dsa-migration)
      $(Device/uimage-lzma-loader)
      IMAGE_SIZE := 30208k
      DEVICE_VENDOR := Xiaomi
      DEVICE_MODEL := Mi Router 4A
      DEVICE_VARIANT := Gigabit Edition 32MB
      DEVICE_PACKAGES := kmod-mt7603 kmod-mt76x2 -uboot-envtools
    endef
    TARGET_DEVICES += xiaomi_mi-router-4a-gigabit-32mb
    EOF
        else
          echo "Device xiaomi_mi-router-4a-gigabit-32mb already exists"
        fi

        grep -A9 '^define Device/xiaomi_mi-router-4a-gigabit-32mb$' "$MT7621_MK"

    - name: Compile initram firmware
      id: compile_initram
      run: |
        cd imwrt
        echo "Checking initram config for 32MB device"
        grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-32mb=y' .config
        grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize initram firmware
      id: organize_initram
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd imwrt/bin/targets/*/*
        initram_file="$(ls *initramfs-kernel.bin 2>/dev/null | head -n 1)"
        test -n "$initram_file"
        mkdir -p "$GITHUB_WORKSPACE/artifacts/release"
        cp -a "$initram_file" "$GITHUB_WORKSPACE/artifacts/release/"
        sha256sum "$initram_file" > "$GITHUB_WORKSPACE/artifacts/release/${initram_file}.sha256sums"
        cp -a profiles.json "$GITHUB_WORKSPACE/artifacts/release/initramfs"
        echo "INITRAM_FIRMWARE=$GITHUB_WORKSPACE/artifacts/release" >> $GITHUB_ENV
        echo "RELEASE_DIR=$GITHUB_WORKSPACE/artifacts/release" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload initram firmware
      uses: actions/upload-artifact@main
      if: steps.organize_initram.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_initram${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.INITRAM_FIRMWARE }}

    - name: Load custom configuration (squash)
      run: |
        cp "$GITHUB_WORKSPACE/files/.config_full" imwrt/.config
        cd imwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Compile squash firmware
      id: compile_squash
      run: |
        cd imwrt
        echo "Checking squash config for 32MB device"
        grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-4a-gigabit-32mb=y' .config
        make defconfig
        make download -j8
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize squash firmware
      id: organize_squash
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd imwrt/bin/targets/*/*
        rm -rf packages
        mkdir -p "$GITHUB_WORKSPACE/artifacts/release"
        find . -maxdepth 1 -type f ! -name '*initram*' -exec cp -a {} "$GITHUB_WORKSPACE/artifacts/release/" \;
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "RELEASE_DIR=$GITHUB_WORKSPACE/artifacts/release" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload squash firmware
      uses: actions/upload-artifact@main
      if: steps.organize_squash.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_squash${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.RELEASE_DIR }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
